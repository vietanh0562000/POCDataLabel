spring.application.name=data-assessment

server.port=8081
# TimescaleDB (PostgreSQL) Configuration
# These can be overridden by environment variables
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

#Kafka Configuration
# Set KAFKA_BOOTSTRAP_SERVERS environment variable to enable Kafka
# For local development: export KAFKA_BOOTSTRAP_SERVERS=localhost:9092
# To disable Kafka: unset KAFKA_BOOTSTRAP_SERVERS or set it to empty string
# Default is localhost:9092 for local development
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.consumer.group-id=data-assessment-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=true
spring.kafka.consumer.auto-commit-interval=5000ms
spring.kafka.consumer.max-poll-records=100
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
